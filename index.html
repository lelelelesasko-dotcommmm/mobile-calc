<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор</title>

<style>
body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: Arial;
    text-align: center;
    padding-top: 100px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    display: inline-block;
}

input, select {
    padding: 10px;
    margin: 10px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    background: #667eea;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="box">
    <h2>Калькулятор</h2>

    <input type="number" id="num1" placeholder="Число 1">

    <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="pow">x^y</option>
        <option value="sqrt">√x</option>
    </select>

    <input type="number" id="num2" placeholder="Число 2">

    <br>
    <button onclick="calculate()">Посчитать</button>

    <div class="result" id="result">Результат: </div>
</div>

<script>
function calculate() {
    let num1 = parseFloat(document.getElementById("num1").value);
    let num2 = parseFloat(document.getElementById("num2").value);
    let op = document.getElementById("operation").value;
    let result = "";

    try {
        if (op === "sqrt") {
            result = Math.sqrt(num1);
        } else if (op === "+") {
            result = num1 + num2;
        } else if (op === "-") {
            result = num1 - num2;
        } else if (op === "*") {
            result = num1 * num2;
        } else if (op === "/") {
            result = num1 / num2;
        } else if (op === "pow") {
            result = Math.pow(num1, num2);
        }

        if (isNaN(result)) {
            result = "Ошибка";
        }

    } catch {
        result = "Ошибка";
    }

    document.getElementById("result").innerText = "Результат: " + result;
}
</script>

</body>
</html>
